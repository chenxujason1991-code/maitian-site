<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="U7TTZPz9pKRqSjUBvslGoz">
<head data-page-node-id="hoByqR38FQx8HcblAdOQNo">
<meta charset="UTF-8" data-page-node-id="o2K4aCdK0xdiMSHX9v13cG">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" data-page-node-id="I5VQnZrzGSxWwrM9wX8wXB">

<title>小田阅读空间 · 记录</title>
<style>
  :root{
    --paper:#f6f2eb; --brown:#8B7355; --brown-deep:#7A6548;
    --leaf:#5B8C5A; --leaf-deep:#4d7d4c;
    --ink:#3d3529; --ink-soft:#7d7365; --line:#e2dacd;
    --warm:#c49450;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    user-select:none; touch-action:manipulation;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .hidden{display:none!important}

  /* ============ 选人层 ============ */
  .layer{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;
    flex-direction:column;align-items:center;justify-content:center;padding:40px}
  .who-wrap{width:100%;max-width:900px;text-align:center}
  .who-wrap h1{font-size:34px;font-weight:600;color:var(--brown-deep);letter-spacing:.04em}
  .who-place{margin-top:16px;font-size:16px;color:var(--brown);letter-spacing:.02em}
  .who-place span{color:#a49a89;font-size:14px}
  .space-jump{margin-top:38px;padding:9px 14px;background:none;border:none;
    font-family:inherit;font-size:14px;color:#a49a89;cursor:pointer;
    text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
  .space-jump:active{color:var(--brown)}
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(60,48,36,.34);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .sheet.hidden{display:none}
  .sheet-box{background:#fff;border-radius:18px;padding:28px 26px 16px;
    width:min(460px,100%);box-shadow:0 18px 48px rgba(60,48,36,.22)}
  .sheet-title{font-size:20px;color:var(--brown-deep);text-align:center;margin-bottom:20px}
  .space-list{display:flex;flex-direction:column;gap:10px}
  .space-item{padding:16px 18px;border-radius:12px;border:1.5px solid #eae4d9;
    background:#fff;font-family:inherit;font-size:17px;color:var(--ink);
    text-align:left;cursor:pointer;transition:all .16s}
  .space-item small{display:block;font-size:12.5px;color:#a49a89;margin-top:4px}
  .space-item.on{border-color:var(--leaf);background:rgba(91,140,90,.07);color:#3f6b3e}
  .space-item.on small{color:#6e8a6d}
  .space-item:active{background:#f7f4ee}
  .space-item.on:active{background:rgba(91,140,90,.12)}
  .sheet-cancel{margin-top:16px;width:100%;padding:13px;border:none;background:none;
    font-family:inherit;font-size:15px;color:#a49a89;cursor:pointer}
  .pick-warn{display:none;margin-top:14px;padding:11px 13px;border-radius:9px;
    background:rgba(196,148,80,.1);border-left:3px solid #c49450;
    font-size:13px;line-height:1.75;color:#7a6040}
  .pick-warn.on{display:block}
  .pick-warn b{color:#5f4a2e;font-weight:600}
  .pick-confirm{margin-top:14px;width:100%;padding:15px;border:none;border-radius:12px;
    background:var(--leaf);color:#fff;font-family:inherit;font-size:16.5px;font-weight:600;
    cursor:pointer;transition:background .16s}
  .pick-confirm:active{background:#4a7a49}
  .who-wrap .who-sub{margin-top:12px;font-size:17px;color:var(--ink-soft)}
  .people{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin-top:52px}
  .person{display:flex;flex-direction:column;align-items:center;gap:12px;width:118px}
  .person .av{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:38px;font-weight:600;color:#fff;
    border:4px solid transparent;transition:transform .16s,border-color .16s}
  .person .nm{font-size:16px;color:var(--ink-soft)}
  .person:active .av{transform:scale(.94)}
  .person .av.c0{background:#c8a882}.person .av.c1{background:#a8b58f}
  .person .av.c2{background:#b9a3a0}.person .av.c3{background:#9aa9b5}
  .person .av.c4{background:#c0a1a8}.person .av.c5{background:#a3b8ae}
  .person.add .av{background:rgba(139,115,85,.09);border:3px dashed #cfc4b0;
    color:var(--brown);font-size:40px;font-weight:300}

  /* ============ 主屏 ============ */
  .screen{position:fixed;inset:0;display:flex;flex-direction:column}
  header{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 32px;border-bottom:1px solid var(--line)}
  .h-left{display:flex;align-items:center;gap:11px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--leaf)}
  .place{font-size:19px;font-weight:600;color:var(--brown-deep)}
  .h-right{display:flex;align-items:center;gap:18px}
  .me-chip{display:flex;align-items:center;gap:9px;padding:7px 16px 7px 7px;
    border-radius:30px;background:rgba(139,115,85,.08);font-size:15px;color:var(--brown-deep)}
  .me-chip .mini{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:15px;font-weight:600}
  .ghost{padding:11px 20px;border-radius:11px;font-size:15px;color:var(--brown-deep);
    border:1.5px solid var(--line);background:#fff}
  .ghost:active{background:#f0ebe1}

  .work{flex:1;display:flex;gap:26px;padding:26px 32px 0;min-height:0}

  /* 图区 */
  .shot-area{flex:1;min-width:0;display:flex;flex-direction:column}
  .slot{flex:1;border-radius:18px;border:2px dashed #cfc4b0;background:rgba(255,255,255,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    transition:border-color .18s,background .18s; position:relative; overflow:hidden}
  .slot.has-img{border-style:solid;border-color:transparent;background:#e8e2d7}
  .slot .cam{width:64px;height:64px;stroke:var(--brown);fill:none;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round}
  .slot .big{font-size:22px;color:var(--brown-deep);font-weight:500}
  .slot .sub{font-size:15px;color:var(--ink-soft)}
  .slot .fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .slot .more{position:absolute;right:14px;bottom:14px;padding:6px 13px;border-radius:20px;
    background:rgba(0,0,0,.55);color:#fff;font-size:13px}
  .thumbs{display:flex;gap:10px;margin-top:12px;height:0;overflow:hidden;transition:height .2s}
  .thumbs.on{height:64px}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:9px;border:2px solid #fff;
    box-shadow:0 2px 8px rgba(90,75,55,.15)}
  .add-tile{width:64px;height:64px;border-radius:9px;border:2px dashed #cfc4b0;
    background:rgba(255,255,255,.6);color:var(--brown);font-size:26px;font-weight:300;
    display:flex;align-items:center;justify-content:center}

  /* 右栏 */
  .panel{width:392px;flex:none;display:flex;flex-direction:column;gap:0}
  .label{font-size:15px;color:var(--ink-soft);margin-bottom:10px}
  .words{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:16px 16px;
    font-size:19px;line-height:1.6;font-family:inherit;color:var(--ink);resize:none;
    height:104px;background:#fff;user-select:text}
  .words:focus{outline:none;border-color:var(--leaf)}
  .words::placeholder{color:#b9b0a1}

  .notice{display:flex;align-items:flex-start;gap:9px;margin-top:14px;padding:11px 14px;
    border-radius:11px;background:rgba(91,140,90,.09);font-size:14px;line-height:1.65;color:#4a6b49}
  .notice svg{width:16px;height:16px;stroke:var(--leaf);fill:none;stroke-width:1.8;flex:none;margin-top:2px}

  .seg{display:flex;gap:9px}
  .seg button{flex:1;padding:13px 4px;border-radius:12px;border:1.5px solid var(--line);
    background:#fff;font-size:15px;color:var(--ink-soft);transition:all .16s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg button.on{border-color:var(--leaf);background:rgba(91,140,90,.08);color:#3f6b3e;font-weight:600}
  .sign-tip{margin-top:9px;font-size:13px;color:#a49a89;line-height:1.55;min-height:20px}
  .space-stat{margin-top:auto;padding-top:16px;font-size:14px;color:#a49a89;
    border-top:1px dashed var(--line)}
  .space-stat b{color:var(--brown-deep);font-weight:600;font-size:16px}

  /* 底栏 */
  footer{flex:none;padding:20px 32px 26px;display:flex;align-items:center;gap:20px}
  .publish{flex:1;height:68px;border-radius:16px;background:var(--leaf);color:#fff;
    font-size:23px;font-weight:600;letter-spacing:.14em;
    box-shadow:0 5px 16px rgba(91,140,90,.3);transition:all .16s}
  .publish:active{background:var(--leaf-deep);transform:translateY(1px);box-shadow:0 3px 10px rgba(91,140,90,.3)}
  .publish:disabled{background:#c6c1b6;box-shadow:none;letter-spacing:.1em}
  .hint{width:176px;flex:none;font-size:13px;color:#a49a89;line-height:1.6}

  /* ============ 空间里的事 ============ */
  .stream-head{height:76px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 32px;border-bottom:1px solid var(--line)}
  .stream-head h2{font-size:22px;font-weight:600;color:var(--brown-deep)}
  .stream-note{padding:16px 32px 0;font-size:14px;color:#8a8172;line-height:1.6}
  .stream-note b{color:var(--brown-deep);font-weight:600;font-size:17px;
    font-family:Georgia,"Songti SC",serif;padding:0 2px}
  .cards{flex:1;display:flex;gap:20px;padding:26px 32px;overflow-x:auto;overflow-y:hidden;
    align-items:stretch;-webkit-overflow-scrolling:touch}
  .card{flex:none;width:300px;height:100%;display:flex;flex-direction:column;
    background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eae4d9;
    box-shadow:0 3px 12px rgba(90,75,55,.07);position:relative}
  .card .img{height:auto;flex:1;min-height:150px;background:#eee7db;position:relative;overflow:hidden}
  .card .img img{width:100%;height:100%;object-fit:cover}
  .card .msg{padding:13px 15px 15px;flex:none;display:flex;flex-direction:column;gap:8px}
  .card .msg .t{font-size:16px;line-height:1.55;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .card .msg .meta{font-size:12.5px;color:#a49a89;display:flex;justify-content:space-between;gap:8px}
  .echoes{display:flex;flex-direction:column;gap:7px;margin-top:2px;padding-top:9px;
    border-top:1px dashed #eee7db}
  .echo{font-size:13.5px;line-height:1.55;color:#6f6759;background:rgba(196,148,80,.07);
    border-radius:9px;padding:8px 11px}
  .echo .who{color:#a07c47;font-weight:600}
  .reply-open{margin-top:6px;align-self:flex-start;font-size:13px;color:#8a7f6e;
    padding:5px 0;border-bottom:1px dashed #d9cfbe}
  .reply-box{display:none;margin-top:6px;gap:8px}
  .reply-box.on{display:flex}
  .reply-box input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;
    user-select:text}
  .reply-box input:focus{outline:none;border-color:var(--leaf)}
  .reply-box button{flex:none;padding:0 16px;border-radius:10px;background:var(--leaf);
    color:#fff;font-size:14px;font-weight:600}
  .card .del{position:absolute;top:9px;right:9px;width:34px;height:34px;border-radius:50%;
    background:rgba(0,0,0,.45);color:#fff;font-size:19px;line-height:1;display:flex;
    align-items:center;justify-content:center}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;color:#a49a89;font-size:17px}

  /* ============ 发出去了 ============ */
  .done-wrap{text-align:center;animation:pop .3s ease-out}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .done-wrap .tick{width:92px;height:92px;border-radius:50%;background:rgba(91,140,90,.12);
    display:flex;align-items:center;justify-content:center;margin:0 auto 26px}
  .done-wrap .tick svg{width:46px;height:46px;stroke:var(--leaf);fill:none;stroke-width:2.6;
    stroke-linecap:round;stroke-linejoin:round}
  .done-wrap h2{font-size:30px;font-weight:600;color:var(--brown-deep)}
  .done-wrap p{margin-top:14px;font-size:17px;color:var(--ink-soft);line-height:1.7}
  .done-wrap .acts{display:flex;gap:14px;justify-content:center;margin-top:38px}
  .done-wrap .acts button{height:62px;padding:0 38px;border-radius:14px;font-size:18px}
  .btn-solid{background:var(--leaf);color:#fff;font-weight:600;
    box-shadow:0 4px 14px rgba(91,140,90,.28)}
  .btn-ghost{border:1.5px solid var(--line);background:#fff;color:var(--brown-deep)}

  /* 竖屏兜底 */
  @media (max-aspect-ratio:1/1){
    .work{flex-direction:column;gap:16px}
    .panel{width:100%}
    .slot{min-height:200px}
    .words{height:78px;font-size:18px}
    footer{padding:14px 20px 18px}
    .publish{height:60px;font-size:20px}
    .hint{display:none}
  }
</style>
</head>

<!-- 隐藏的文件选择 -->
<input type="file" id="fileCam" accept="image/*" capture="environment" style="display:none" data-page-node-id="cOumJE6F6D54HshtgDSA2u">

<script src="maitian-space-sync.js"></script>
<script>
/* =========================================================
   小田阅读空间 · pad 端记录页
   数据先写云端（Supabase），连不上就留在这台 pad 上。
   两边都能用，界面上不弹错误——网络好坏不该变成孩子的负担。
   ========================================================= */

var SPACE_KEY  = 'mt_space_posts_v1';
var PEOPLE_KEY = 'mt_space_people_v1';
var CUR_KEY    = 'mt_space_current_v1';   // 这台 pad 设在哪个空间
var CUR_LOG    = 'mt_space_log_v1';       // 什么时候被换过，误改了能看出来

/* 空间清单跟 sync.js 共用一份。那边加一行，这里自动就有。 */
var SPACES = (window.MTSpace && MTSpace.SPACES) ||
             [{ key: '小田', full: '滑县大寨乡小田小学' }];

/* 一台 pad 固定放在一个空间，所以这个值设好之后就不该再动。
   没设过 = 新设备或换过设备，必须让人明确选一次，
   不能默默默认成清单里的第一所——那会让另一所学校的内容悄悄记错地方，
   而且没人会发现。 */
function readCurSpace() {
  try {
    var v = localStorage.getItem(CUR_KEY);
    for (var i = 0; i < SPACES.length; i++) if (SPACES[i].key === v) return v;
  } catch (e) {}
  return null;
}

var FIRST_RUN    = readCurSpace() === null;
var SPACE_NAME   = readCurSpace() || SPACES[0].key;
var pickMode     = 'change';   // 'first' 首次设定 / 'change' 更换
var pendingSpace = null;

function spaceFull(key) {
  for (var i = 0; i < SPACES.length; i++) {
    if (SPACES[i].key === key) return SPACES[i].full;
  }
  return key || '';
}

var cloudPosts = null;   // null = 还没连上（读本地）；数组 = 云端数据为准
var cloudOn    = false;  // 探活结果

var signMode = 'space';
var me = null;
var shots = [];          // 本次要发布的图
var mySessionIds = [];   // 本机本次打开里发的，允许自己撤

/* ---------- 名单 ---------- */
function loadPeople() {
  var p = null;
  try { p = JSON.parse(localStorage.getItem(PEOPLE_KEY)); } catch (e) {}
  if (!p || !p.length) {
    p = [{ n: '小美' }, { n: '阿哲' }, { n: '王老师' }];
    localStorage.setItem(PEOPLE_KEY, JSON.stringify(p));
  }
  return p;
}

/* ---------- 空间 ---------- */
/* 空间变了，屏幕上所有跟它有关的字都要跟着变。
   集中在一处改，免得漏掉某个角落还写着「小田」。 */
function applySpace() {
  var place = document.getElementById('whoPlace');
  if (place) {
    place.innerHTML = FIRST_RUN
      ? '这台 pad 还没有设置空间'
      : esc(spaceFull(SPACE_NAME)) + ' <span>· 阅读空间</span>';
  }

  var jump = document.getElementById('spaceJump');
  if (jump) {
    jump.style.display = (SPACES.length > 1 && !FIRST_RUN) ? '' : 'none';
    jump.textContent = '这台 pad 固定在这里' + lastSetText() + ' · 更换';
  }

  var head = document.querySelector('header .place');
  if (head) head.textContent = spaceFull(SPACE_NAME) + ' · 阅读空间';

  var notice = document.querySelector('.notice span');
  if (notice) notice.textContent =
    '这条会出现在麦田网站上，关心' + SPACE_NAME + '的人都会看到。';

  var btn = document.getElementById('signSpace');
  if (btn) btn.textContent = SPACE_NAME + '的读者';
}

function renderSpacePick() {
  document.getElementById('spaceList').innerHTML = SPACES.map(function (s) {
    return '<button class="space-item" data-key="' + esc(s.key) + '"' +
      ' onclick="selectSpace(\'' + s.key + '\')">' +
      esc(s.full) + '<small>' + esc(s.key) + '的读者</small></button>';
  }).join('');
}

/* 点一下只是选中，不立刻生效。
   固定在一处的 pad，误点一次不该就把整个学校换掉——
   得再点一下「换到这里」才算。 */
function selectSpace(key) {
  pendingSpace = key;
  var items = document.querySelectorAll('.space-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('on', items[i].getAttribute('data-key') === key);
  }
  var cf = document.getElementById('pickConfirm');
  cf.textContent = key === SPACE_NAME ? '就是这里' : '换到这里：' + spaceFull(key);
  cf.disabled = false;
  cf.classList.remove('hidden');
}

function openSpacePick(first) {
  var isFirst = first === true || FIRST_RUN;
  pickMode = isFirst ? 'first' : 'change';
  pendingSpace = null;

  document.getElementById('pickTitle').textContent =
    isFirst ? '这台 pad 放在哪个空间？' : '换成另一个空间';

  var warn = document.getElementById('pickWarn');
  warn.innerHTML = isFirst
    ? '一所学校一台 pad，选好就一直用这个。选错了，网站上会显示到别的学校去。' +
      '点上面一所学校继续。'
    : '这台 pad 现在记在 <b>' + esc(spaceFull(SPACE_NAME)) + '</b>。换掉之后，' +
      '<b>以前发过的内容不会跟着搬</b>，只有今后发的新内容算新空间。';
  warn.classList.add('on');

  document.getElementById('pickCancel').style.display = isFirst ? 'none' : '';
  var cf = document.getElementById('pickConfirm');
  cf.classList.add('hidden');
  cf.disabled = true;

  renderSpacePick();
  document.getElementById('spacePick').classList.remove('hidden');
}

function closeSpacePick(force) {
  // 首次设定没选完不能关，否则会停在一个没有空间的空壳上
  if (pickMode === 'first' && force !== true) return;
  document.getElementById('spacePick').classList.add('hidden');
  document.getElementById('pickWarn').classList.remove('on');
  document.getElementById('pickConfirm').classList.add('hidden');
}

function confirmSpace() {
  if (!pendingSpace) return;

  var from = FIRST_RUN ? '' : SPACE_NAME;
  if (pendingSpace !== SPACE_NAME || FIRST_RUN) {
    SPACE_NAME = pendingSpace;
    try {
      localStorage.setItem(CUR_KEY, SPACE_NAME);
      logSpaceChange(from, SPACE_NAME);
    } catch (e) {}
  }

  FIRST_RUN = false;
  pickMode = 'change';
  closeSpacePick(true);
  applySpace();
  if (me) { setSign(signMode); updateStat(); }
}

/* 换空间的记录。没有查看后台，但底部那行会显示「哪天设的」——
   日期不对，就是被人动过。 */
function logSpaceChange(from, to) {
  try {
    var l = JSON.parse(localStorage.getItem(CUR_LOG)) || [];
    l.unshift({ from: from || '', to: to, t: new Date().toISOString() });
    localStorage.setItem(CUR_LOG, JSON.stringify(l.slice(0, 20)));
  } catch (e) {}
}
function lastSetText() {
  try {
    var l = JSON.parse(localStorage.getItem(CUR_LOG)) || [];
    if (!l.length) return '';
    var d = new Date(l[0].t);
    if (isNaN(d.getTime())) return '';
    return '（' + (d.getMonth() + 1) + '月' + d.getDate() + '日' +
      (l[0].from ? '换过' : '设定') + '）';
  } catch (e) { return ''; }
}

/* 只算当前空间里的。几个学校混在一起，孩子不该看到别处的记录。 */
function postsHere() {
  return loadPosts().filter(function (p) {
    // 早期数据存的是「小田阅读空间」，也认
    return p.space === SPACE_NAME || p.space === SPACE_NAME + '阅读空间';
  });
}

function renderPeople() {
  var list = loadPeople();
  var box = document.getElementById('peopleList');
  box.innerHTML = list.map(function (p, i) {
    return '<div class="person" onclick="choosePerson(' + i + ')">' +
      '<div class="av c' + (i % 6) + '">' + esc(avatarChar(p.n)) + '</div>' +
      '<div class="nm">' + esc(p.n) + '</div></div>';
  }).join('') +
  '<div class="person add" onclick="addPerson()">' +
  '<div class="av">+</div><div class="nm">加一个人</div></div>';
}

function addPerson() {
  var n = prompt('新来的人叫什么？（写小名就行，不用写姓）');
  if (!n) return;
  n = n.trim().slice(0, 8);
  if (!n) return;
  var list = loadPeople();
  list.push({ n: n });
  localStorage.setItem(PEOPLE_KEY, JSON.stringify(list));
  renderPeople();
}

function choosePerson(i) {
  var list = loadPeople();
  if (!list[i]) return;
  me = list[i].n;
  enterMain();
}

function switchPerson() {
  me = null;
  document.getElementById('who').classList.remove('hidden');
  document.getElementById('main').classList.add('hidden');
  closeStream(true);
}

function enterMain() {
  document.getElementById('who').classList.add('hidden');
  document.getElementById('done').classList.add('hidden');
  document.getElementById('stream').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');

  document.getElementById('meName').textContent = me;
  var mini = document.getElementById('meMini');
  mini.textContent = avatarChar(me);
  mini.style.background = avatarColor(me);

  // 署名按钮跟着换人更新
  document.getElementById('signMe').textContent = me;
  document.getElementById('signSpace').textContent = SPACE_NAME + '的读者';
  applySpace();
  setSign(signMode);
  updateStat();
}

function updateStat() {
  var n = postsHere().length;
  document.getElementById('spaceStat').innerHTML = n
    ? '这个空间里已经记了 <b>' + n + '</b> 条'
    : '这个空间里还没有记录，第一条可以是你的';
}

/* ---------- 选图 ---------- */
document.getElementById('fileCam').addEventListener('change', onFile);
document.getElementById('filePick').addEventListener('change', onFile);

function onFile(e) {
  var f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  var r = new FileReader();
  r.onload = function (ev) {
    var img = new Image();
    img.onload = function () {
      var maxW = 1200, w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      shots.push(c.toDataURL('image/jpeg', 0.78));
      renderShots();
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
}

function renderShots() {
  var slot = document.getElementById('slot');
  var thumbs = document.getElementById('thumbs');

  if (!shots.length) {
    slot.className = 'slot';
    slot.innerHTML =
      '<svg class="cam" viewBox="0 0 24 24">' +
      '<path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7a1 1 0 0 0 .83-.45l.94-1.4A1 1 0 0 1 9.8 3.7h4.4a1 1 0 0 1 .83.45l.94 1.4a1 1 0 0 0 .83.45h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/>' +
      '<circle cx="12" cy="12.3" r="3.4"/></svg>' +
      '<div class="big">拍一张</div><div class="sub">也可以从相册里选</div>';
    thumbs.className = 'thumbs';
    thumbs.innerHTML = '';
    document.getElementById('btnPublish').disabled = true;
    document.getElementById('hint').textContent = '加上一张照片就可以发了';
    return;
  }

  slot.className = 'slot has-img';
  slot.innerHTML = '<img class="fill" src="' + shots[0] + '">' +
    (shots.length > 1 ? '<div class="more">共 ' + shots.length + ' 张</div>' : '');

  thumbs.className = 'thumbs on';
  thumbs.innerHTML = shots.map(function (s, i) {
    return '<img src="' + s + '" onclick="event.stopPropagation();removeShot(' + i + ')">';
  }).join('') +
  '<button class="add-tile" onclick="event.stopPropagation();document.getElementById(\'fileCam\').click()">+</button>';

  document.getElementById('btnPublish').disabled = false;
  document.getElementById('hint').textContent = '发出去之后，空间里就看到了';
}

function removeShot(i) {
  shots.splice(i, 1);
  renderShots();
}

/* 点图区：没图时从相册选（选择器里也能直接拍）；已有图时点缩略图上的 + 再加 */
document.getElementById('slot').addEventListener('click', function () {
  if (!shots.length) document.getElementById('filePick').click();
});
document.getElementById('slot').addEventListener('contextmenu', function (e) {
  e.preventDefault();
  document.getElementById('fileCam').click();
});

/* ---------- 署名 ---------- */
var signTips = {
  me: '写你自己想的名字就行，别写全名。',
  space: '网站上不写全名，看到的是「小田的读者」。',
  none: '网站上只有阅读空间和日期，没有署名。'
};
function setSign(which) {
  signMode = which;
  document.querySelectorAll('#signSeg button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.sign === which);
  });
  var tip = signTips[which] || '';
  if (which === 'space') tip = '网站上不写全名，看到的是「' + SPACE_NAME + '的读者」。';
  document.getElementById('signTip').textContent = tip;
}

/* ---------- 发布 ---------- */
function doPublish() {
  if (!shots.length || !me) return;
  var btn = document.getElementById('btnPublish');
  if (btn.disabled) return;

  var post = {
    id: 'local-' + Date.now(),
    space: SPACE_NAME,                // 存在哪个阅读空间
    author: me,                       // 空间里知道是谁写的
    signMode: signMode,               // 网站上怎么署名
    signLabel: signMode === 'me' ? me
             : signMode === 'space' ? SPACE_NAME + '的读者'
             : '',
    text: document.getElementById('words').value.trim(),
    images: shots.slice(),
    time: new Date().toISOString(),
    replies: []
  };

  // 先让它落进空间里，不让人对着按钮等
  var all = loadPosts();
  all.unshift(post);
  savePosts(all);
  mySessionIds.push(post.id);
  cacheLocal(post);

  // 发完清场
  shots = [];
  document.getElementById('words').value = '';
  renderShots();

  document.getElementById('main').classList.add('hidden');
  document.getElementById('done').classList.remove('hidden');
  setDoneMsg(post, window.MTSpace ? 'sending' : 'local');

  // 不看探测结果，直接试着发。
  // 探测可能还没回来，错过了这条就永远上不去——宁可多试一次。
  if (!window.MTSpace) return;

  window.MTSpace.publish(post).then(function (saved) {
    if (!saved) { setDoneMsg(post, 'local'); return; }

    // 云端给了真实 id，把本地那条换掉
    var i = mySessionIds.indexOf(post.id);
    if (i >= 0) mySessionIds[i] = saved.id;
    if (cloudPosts) {
      for (var k = 0; k < cloudPosts.length; k++) {
        if (cloudPosts[k].id === post.id) { cloudPosts[k] = saved; break; }
      }
    }
    post.id = saved.id;
    setDoneMsg(post, 'cloud');
  });
}

/* 发完之后那句提示：说实话，别让人以为都上网站了 */
function setDoneMsg(post, state) {
  var who = post.signLabel
    ? '网站上会看到「' + esc(post.signLabel) + '」。'
    : '网站上这条不署名。';

  var msg;
  if (state === 'sending') {
    msg = '正在放到空间里……';
  } else if (state === 'cloud') {
    msg = '这条已经在空间里了，网站上马上能看到。' + who;
  } else {
    msg = '这条记在这台 pad 上了，但它还没到网站——现在网络不通。' + who;
  }
  document.getElementById('doneMsg').innerHTML = msg;
}

function again() {
  document.getElementById('done').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  updateStat();
}

/* ---------- 存读 ---------- */
/* 连上了云端就以云端为准；没连上读本地。
   本地那份不清空——网络断了它还能撑住一片。 */
function loadPosts() {
  if (cloudPosts) return cloudPosts;
  try { return JSON.parse(localStorage.getItem(SPACE_KEY)) || []; }
  catch (e) { return []; }
}
function savePosts(list) {
  if (cloudPosts) { cloudPosts = list; return; }
  // 图片存本地，pad 上几十条就会顶到浏览器上限。满了就少存几条，不要崩。
  try {
    localStorage.setItem(SPACE_KEY, JSON.stringify(list));
  } catch (e) {
    try { localStorage.setItem(SPACE_KEY, JSON.stringify(list.slice(0, 10))); } catch (e2) {}
  }
}
/* 不管哪种模式，本地都留一份。换设备看不到，但这台不会空。 */
function cacheLocal(post) {
  try {
    var l = JSON.parse(localStorage.getItem(SPACE_KEY)) || [];
    l.unshift(post);
    localStorage.setItem(SPACE_KEY, JSON.stringify(l.slice(0, 40)));
  } catch (e) {}
}

/* ---------- 空间里的事 ---------- */
function openStream() {
  document.getElementById('done').classList.add('hidden');
  document.getElementById('main').classList.add('hidden');
  document.getElementById('stream').classList.remove('hidden');
  renderStream();
  refreshStream();
}
function closeStream(silent) {
  document.getElementById('stream').classList.add('hidden');
  if (!silent && me) document.getElementById('main').classList.remove('hidden');
  else if (!silent) document.getElementById('who').classList.remove('hidden');
}

function renderStream() {
  var list = postsHere();
  var box = document.getElementById('cards');
  var sc = box.scrollLeft;

  document.getElementById('streamCount').textContent =
    list.length ? '一共 ' + list.length + ' 条' : '';

  // 数字只放在空间这一层，不落到单条记录上
  var who = {};
  list.forEach(function (p) {
    (p.replies || []).forEach(function (r) { who[r.author] = 1; });
  });
  var n = Object.keys(who).length;
  document.getElementById('streamNote').innerHTML = list.length
    ? '这个空间里记了 <b>' + list.length + '</b> 条' +
      (n ? '，有 <b>' + n + '</b> 位伙伴留过话' : '，还没有人留话')
    : '';

  if (!list.length) {
    box.innerHTML = '<div class="empty">' +
      '<div style="font-size:19px">空间里还没有记录</div>' +
      '<div>等谁发第一条</div></div>';
    return;
  }

  box.innerHTML = list.map(function (p) {
    var mine = mySessionIds.indexOf(p.id) >= 0;
    var noText = !p.text;
    var rs = p.replies || [];
    var shown = rs.slice(-2);

    var echoes = shown.length
      ? '<div class="echoes">' + shown.map(function (r) {
          return '<div class="echo"><span class="who">' + esc(r.author) + '</span> ' +
                 esc(r.text) + '</div>';
        }).join('') +
        (rs.length > 2 ? '<div style="font-size:12.5px;color:#a49a89">还有 ' +
          (rs.length - 2) + ' 句</div>' : '') + '</div>'
      : '';

    return '<div class="card' + (noText ? ' no-text' : '') + '">' +
      (mine ? '<button class="del" onclick="dropPost(\'' + p.id + '\')">×</button>' : '') +
      '<div class="img">' + (p.images && p.images[0]
        ? '<img src="' + p.images[0] + '">' : '') + '</div>' +
      '<div class="msg">' +
        (noText ? '' : '<div class="t">' + esc(p.text) + '</div>') +
        echoes +
        '<div class="meta"><span>' + esc(p.signLabel || '未署名') + '</span>' +
        '<span>' + whenStr(p.time) + '</span></div>' +
        '<button class="reply-open" onclick="openReply(\'' + p.id + '\')">回一句</button>' +
        '<div class="reply-box" id="reply-' + p.id + '">' +
          '<input id="replyInput-' + p.id + '" placeholder="回一句……" ' +
          'onkeydown="if(event.key===\'Enter\')sendReply(\'' + p.id + '\')">' +
          '<button onclick="sendReply(\'' + p.id + '\')">发</button>' +
        '</div>' +
      '</div></div>';
  }).join('');

  box.scrollLeft = sc;
}

function openReply(id) {
  var box = document.getElementById('reply-' + id);
  if (!box) return;
  box.classList.add('on');
  var btn = box.parentNode.querySelector('.reply-open');
  if (btn) btn.style.display = 'none';
  var i = document.getElementById('replyInput-' + id);
  if (i) i.focus();
}

function sendReply(id) {
  var inp = document.getElementById('replyInput-' + id);
  if (!inp) return;
  var t = (inp.value || '').trim();
  if (!t) { inp.focus(); return; }

  var list = loadPosts();
  var p = null;
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].id) === String(id)) p = list[i];
  }
  if (!p) return;

  var r = {
    id: 'local-' + Date.now(),
    author: me || '空间里的人',
    text: t.slice(0, 60),
    time: new Date().toISOString(),
    from: 'inside'
  };
  p.replies = p.replies || [];
  p.replies.push(r);
  savePosts(list);
  renderStream();

  // 这条要是还在本地（没上云），回应也就留在本地——别让半个东西上路
  if (cloudOn && window.MTSpace && isCloudId(id)) {
    window.MTSpace.reply(Number(id), r.author, r.text, false).then(function (saved) {
      if (saved) r.id = saved.id;
    });
  }
}

function dropPost(id) {
  if (!confirm('把这条撤下来？撤了就不在空间里了。')) return;
  var list = loadPosts().filter(function (p) { return String(p.id) !== String(id); });
  savePosts(list);
  renderStream();

  // 云端不真删，只打标记：删掉就查不出是谁撤的了
  if (cloudOn && window.MTSpace && isCloudId(id)) {
    window.MTSpace.hide(Number(id));
  }
}

/* 云端 id 是数字，本地临时 id 带 local- 前缀，别混 */
function isCloudId(id) {
  return /^\d+$/.test(String(id));
}

/* ---------- 小工具 ---------- */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function avatarChar(name) {
  var n = String(name || '');
  if (!n) return '?';
  // 「小美」「阿哲」取末字更好认；「王老师」取首字
  if (n.indexOf('老师') >= 0 || n.indexOf('先生') >= 0 || n.indexOf('妈妈') >= 0) return n.charAt(0);
  return n.charAt(n.length - 1);
}
function avatarColor(name) {
  var c = ['#c8a882', '#a8b58f', '#b9a3a0', '#9aa9b5', '#c0a1a8', '#a3b8ae'];
  var h = 0;
  for (var i = 0; i < String(name).length; i++) h = ((h << 5) - h) + String(name).charCodeAt(i);
  return c[Math.abs(h) % c.length];
}
function whenStr(iso) {
  var d = new Date(iso), n = new Date();
  var sameDay = d.toDateString() === n.toDateString();
  var pad = function (x) { return x < 10 ? '0' + x : '' + x; };
  var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (sameDay) return '今天 ' + hm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}

/* ---------- 云端 ---------- */
/* 启动时试一次。连不上就安静地用本地，不弹任何提示——
   网络好坏不该变成孩子面前的一道错误框。 */
function bootSync() {
  if (!window.MTSpace) { cloudOn = false; return; }
  window.MTSpace.list(30).then(function (rows) {
    cloudOn = true;
    cloudPosts = rows;
    updateStat();
    if (!document.getElementById('stream').classList.contains('hidden')) refreshStream();
  }).catch(function () {
    cloudOn = false;
    cloudPosts = null;
  });
}

/* 打开「空间里的事」时再拉一次，让刚发的别人也能看到 */
function refreshStream() {
  if (!cloudOn || !window.MTSpace) return;
  // 有人正在写回应就先别动 DOM，会把他打的字冲掉
  if (document.querySelector('.reply-box.on')) return;
  window.MTSpace.list(30).then(function (rows) {
    cloudPosts = rows;
    renderStream();
  }).catch(function () {});
}

/* ---------- 启动 ---------- */
applySpace();
renderPeople();
renderShots();
bootSync();

/* 没设置过空间的设备（新 pad、或者坏掉换了一台），
   先让它明确选一次再开始用。只有一所学校时没什么可选的，直接认定。 */
if (FIRST_RUN) {
  if (SPACES.length > 1) {
    openSpacePick(true);
  } else {
    FIRST_RUN = false;
    try { localStorage.setItem(CUR_KEY, SPACE_NAME); } catch (e) {}
    applySpace();
  }
}
</script>
